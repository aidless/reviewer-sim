# CI for reviewer-sim
#
# Scope note, verified against the tree on 2026-10-05: this repository has no test
# suite. pytest.ini points testpaths at tests/, but that directory does not exist and
# no test_*.py file is tracked anywhere in the repository. `pytest -q` therefore exits
# 5 ("no tests ran"), which is not a failure of the code — it is an absence of tests.
# The 20 modules under core/ and agents/ are real code, so CI checks them the honest
# way available: they must all compile, and the CLI entry points must import cleanly
# (import is checked without executing, so no API keys or network are needed).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every tracked module
        run: python -m compileall -q core agents *.py

      - name: Import every core and agents module without executing its main
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          mods = sorted(str(p.with_suffix("")).replace("/", ".")
                       for d in ("core", "agents")
                       for p in pathlib.Path(d).rglob("*.py")
                       if "__pycache__" not in p.parts)
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as exc:
                  bad.append(f"{m}: {type(exc).__name__}: {exc}")
          print(f"imported {len(mods) - len(bad)}/{len(mods)} modules")
          if bad:
              sys.exit("import failures:\n  " + "\n  ".join(bad))
          PY

      - name: Report the absent test suite as a warning
        run: |
          if [ ! -d tests ] && ! git ls-files | grep -q '^test.*\.py$'; then
            echo "::warning::no test suite is tracked in this repository"
            echo "::warning::(pytest.ini sets testpaths = tests, but tests/ does"
            echo "::warning::not exist). CI verifies compilation and importability."
          fi
          echo "OK (advisory only)"

  mutation-control:
    # Proves the syntax gate can fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Introduce a syntax error and require a non-zero exit
        shell: bash
        run: |
          set -euo pipefail
          target="$(git ls-files 'core/*.py' | head -1)"
          cp "$target" /tmp/target.py.bak
          printf '\ndef broken(:\n    pass\n' >> "$target"
          if python -m compileall -q "$target" >/dev/null 2>&1; then
            echo 'FAIL: compileall accepted a file with a syntax error'
            exit 1
          fi
          echo 'OK: the gate rejected the injected syntax error'