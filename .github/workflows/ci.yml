# CI for reviewer-sim
#
# Scope note, verified against the tree on 2026-11-01: a real offline test suite
# now lives in tests/ (38 tests, no API keys / no network needed). It covers
# config loading (weights sum to 100, threshold sorting), helpers (sanitize,
# hashing, novelty adjustment), and the score -> recommendation mapping.
# The 20 modules under core/ and agents/ are still compiled and imported to
# catch syntax/import regressions. LLM calls are NOT executed in CI.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every tracked module
        run: python -m compileall -q core agents *.py

      - name: Import every core and agents module without executing its main
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          mods = sorted(str(p.with_suffix("")).replace("/", ".")
                       for d in ("core", "agents")
                       for p in pathlib.Path(d).rglob("*.py")
                       if "__pycache__" not in p.parts)
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as exc:
                  bad.append(f"{m}: {type(exc).__name__}: {exc}")
          print(f"imported {len(mods) - len(bad)}/{len(mods)} modules")
          if bad:
              sys.exit("import failures:\n  " + "\n  ".join(bad))
          PY

      - name: Run the offline test suite
        run: python -m pytest tests/ -o addopts="" -q

  mutation-control:
    # Proves the syntax gate can fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Introduce a syntax error and require a non-zero exit
        shell: bash
        run: |
          set -euo pipefail
          target="$(git ls-files 'core/*.py' | head -1)"
          cp "$target" /tmp/target.py.bak
          printf '\ndef broken(:\n    pass\n' >> "$target"
          if python -m compileall -q "$target" >/dev/null 2>&1; then
            echo 'FAIL: compileall accepted a file with a syntax error'
            exit 1
          fi
          echo 'OK: the gate rejected the injected syntax error'

  secret-scan:
    # .gitleaks.toml and .pre-commit-config.yaml are present, but a pre-commit
    # hook is opt-in, missing from a fresh clone (.git/hooks holds only *.sample),
    # bypassable with `git commit --no-verify`, and only ever inspects staged
    # content -- never history. Nothing in CI looked at secrets, so a committed
    # key would have left every other check green.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - name: gitleaks (full history, CLI)
        # The gitleaks-action v2 was here first and turned every Dependabot pull
        # request red with "GITHUB_TOKEN is now required to scan pull requests" --
        # a failure caused by the action's requirements, not by the repository.
        # Dependabot runs the workflow from its own branch, so fixing it on main
        # does not help until the PR is regenerated. The CLI needs no token, scans
        # the same checked-out history, and has one fewer moving part.
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
