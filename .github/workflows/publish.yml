name: Publish to PyPI
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          if ls pyproject.toml setup.py setup.cfg >/dev/null 2>&1; then
            python -m build --sdist --wheel --outdir dist/
          else
            echo "no packaging metadata; skipping build"
          fi
      - name: Publish (trusted publishing)
        if: ${{ github.event_name == 'release' && hashFiles('pyproject.toml', 'setup.py', 'setup.cfg') != '' }}
        uses: pypa/gh-action-pypi-publish@2442bad8f54b06a326f3030ef5e6a7a674118557 # release/v1
